<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ApnaGhar Rent App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mobile-shell">
      <!-- AUTH SCREEN -->
      <section id="authSection" class="screen active">
        <div class="brand-box">
          <div class="logo">🏠</div>
          <h1>ApnaGhar Rent</h1>
          <p>Direct Owner to Tenant Room & House Finder</p>
        </div>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('login', this)">
            Login
          </button>
          <button class="tab" onclick="switchTab('signup', this)">
            Signup
          </button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
          <input
            type="email"
            id="loginEmail"
            placeholder="Email daalo"
            required
          />
          <input
            type="password"
            id="loginPass"
            placeholder="Password daalo"
            required
          />
          <button type="submit" class="btn-primary">Login Karo</button>
        </form>

        <!-- Signup Form with Role Selection -->
        <form id="signupForm" class="form" onsubmit="handleSignup(event)">
          <input type="text" id="signName" placeholder="Poora Naam" required />
          <input
            type="email"
            id="signEmail"
            placeholder="Email daalo"
            required
          />
          <input
            type="tel"
            id="signPhone"
            placeholder="Mobile / WhatsApp Number (10 digit)"
            required
          />
          <input
            type="password"
            id="signPass"
            placeholder="Password banao"
            required
          />
          <select id="signRole" required>
            <option value="tenant">
              🔍 Mujhe Ghar Kiraye Par Chahiye (Tenant)
            </option>
            <option value="owner">
              🏠 Mujhe Apna Ghar Kiraye Par Dena Hai (Owner)
            </option>
          </select>
          <button type="submit" class="btn-primary">Account Banao</button>
        </form>
      </section>

      <!-- MAIN APP SCREEN -->
      <section id="appSection" class="screen">
        <header class="topbar">
          <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
          <span class="title">🏠 ApnaGhar</span>
          <button id="gpsBtn" class="gps-pill" onclick="detectUserLocation()">
            📍 GPS
          </button>
        </header>

        <!-- Left Hamburger Drawer -->
        <div id="overlay" class="overlay" onclick="toggleMenu(false)"></div>
        <aside id="drawer" class="drawer">
          <div class="profile-head">
            <h3 id="userName">User</h3>
            <span id="userRoleBadge" class="role-badge">TENANT</span>
          </div>
          <nav class="nav-list">
            <button
              onclick="openView('feedView'); loadHouses(); toggleMenu(false)"
            >
              🔍 Sabhi Ghar Dekho
            </button>
            <button
              id="navAddHouse"
              onclick="openView('addView'); toggleMenu(false)"
            >
              ➕ Naya Ghar daalo (Owner)
            </button>
            <button
              id="navMyHouses"
              onclick="openView('myHousesView'); loadMyHouses(); toggleMenu(false)"
            >
              📋 Mere Daale Hue Ghar
            </button>
            <button class="logout" onclick="logout()">🚪 Logout</button>
          </nav>
        </aside>

        <!-- VIEW 1: HOME FEED + SMART FILTERS -->
        <main id="feedView" class="view active">
          <div class="filter-card">
            <input
              type="text"
              id="searchInput"
              placeholder="City ya Area (e.g. Jodhpur, Basni, Udaipur)"
              oninput="loadHouses()"
            />
            <div class="filter-row">
              <select id="typeFilter" onchange="loadHouses()">
                <option value="All">All Types</option>
                <option value="1RK">1RK</option>
                <option value="1BHK">1BHK</option>
                <option value="2BHK">2BHK</option>
              </select>
              <select id="kmFilter" onchange="loadHouses()">
                <option value="All">📍 Any Distance</option>
                <option value="2">Within 2 km</option>
                <option value="5">Within 5 km</option>
                <option value="10">Within 10 km</option>
              </select>
              <select id="maxRentFilter" onchange="loadHouses()">
                <option value="">💰 Any Rent</option>
                <option value="2000">Under ₹2,000</option>
                <option value="5000">Under ₹5,000</option>
                <option value="10000">Under ₹10,000</option>
                <option value="20000">Under ₹20,000</option>
              </select>
            </div>
          </div>
          <div id="houseFeed" class="house-list"></div>
        </main>

        <!-- VIEW 2: ADD HOUSE (ONLY OWNER) -->
        <main id="addView" class="view">
          <h2>➕ Naya Ghar / Room Post Karo</h2>
          <form class="form active" onsubmit="submitHouse(event)">
            <input
              type="text"
              id="hTitle"
              placeholder="Title (e.g. 2BHK Independent House)"
              required
            />
            <div class="row-2">
              <input
                type="number"
                id="hRent"
                placeholder="Monthly Rent (₹)"
                required
              />
              <input
                type="number"
                id="hDeposit"
                placeholder="Deposit (₹)"
                required
              />
            </div>
            <select id="hType" required>
              <option value="1RK">1RK (1 Room Kitchen)</option>
              <option value="1BHK">1BHK</option>
              <option value="2BHK">2BHK</option>
            </select>
            <div class="row-2">
              <input
                type="text"
                id="hCity"
                placeholder="City (e.g. Jodhpur)"
                required
              />
              <input
                type="text"
                id="hArea"
                placeholder="Area (e.g. Basni)"
                required
              />
            </div>

            <button type="button" class="btn-gps" onclick="pinHouseLocation()">
              📍 Ghar ki Current GPS Location Save Karo
            </button>
            <small id="gpsStatus" class="hint-text"
              >Location abhi pin nahi hui hai</small
            >

            <label class="file-label">📸 Ghar ki Photo Chuno (Gallery)</label>
            <label
              for="hPhoto"
              style="
                display: block;
                padding: 12px;
                background: #fff;
                border: 1.5px dashed #2563eb;
                border-radius: 10px;
                text-align: center;
                color: #2563eb;
                font-weight: 700;
                cursor: pointer;
              "
              >📸 Gallery se Photos Chuno</label
            >
            <input
              type="file"
              id="hPhoto"
              multiple
              accept="image/*"
              required
              style="display: none"
              onchange="this.previousElementSibling.innerText = '✅ ' + this.files.length + ' Photo Selected'"
            />

            <button type="submit" id="postBtn" class="btn-primary">
              🚀 Ghar Live Karo
            </button>
          </form>
        </main>

        <!-- VIEW 3: MY HOUSES (OWNER DASHBOARD: PUT & DELETE) -->
        <main id="myHousesView" class="view">
          <h2>📋 Mere Daale Hue Ghar</h2>
          <div id="myHouseList" class="house-list"></div>
        </main>
      </section>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
